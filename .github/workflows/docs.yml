name: Documentation and reference-code validation
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r docs/requirements.txt
      - run: python tools/release_check.py --source-only
      - run: python -m compileall -q docs/editions/alpha/4-scripts/files
      - run: python -m unittest discover -s docs/editions/alpha/4-scripts/files/tests -v
      - run: sphinx-build -W --keep-going -b html docs _build/html
      - run: sphinx-build -b linkcheck docs _build/linkcheck
