name: Build offline release artifacts
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: sudo apt-get update && sudo apt-get install -y pandoc libreoffice
      - run: pip install -r docs/requirements.txt python-docx
      - run: python tools/build_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: capybara-framework-offline-editions
          path: release/*
